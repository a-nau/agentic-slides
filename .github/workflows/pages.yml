# Render every deck with Quarto and publish it on GitHub Pages
# (scripts/build_site.sh). The downloads (self-contained HTML, editable PPTX,
# PDF) are off by default; run the workflow by hand with "exports" ticked to
# prebuild them (Actions → Deploy decks to GitHub Pages → Run workflow).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy decks to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      exports:
        description: Prebuild HTML / PPTX / PDF downloads for every deck
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Ubuntu 24.04 runner image (GitHub updates it, Chrome included): its Google
    # Chrome drives the PDF / editable-PPTX exports when they are on.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read    # configure-pages reads the site settings
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # last-commit dates for the landing pages
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Python deps (exact versions, hash-checked)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes -r scripts/pptx_export/requirements.lock
      - name: Quarto toolchain (Quarto 1.10.18, MathJax 3.2.2, web fonts; all checksum-verified)
        run: quarto/scripts/setup.sh
      - run: scripts/build_site.sh _site
        env:
          SITE_EXPORTS: ${{ inputs.exports && '1' || '0' }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # Only the deploy job can publish; the build job (which installs packages) cannot.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
