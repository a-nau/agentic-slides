# Quarto (reveal.js) decks, Marp-compatible: decks/**/slides.qmd. Tooling in quarto/ (see quarto/README.md).
project:
  type: default
  # No output-dir: each deck renders in place (slides.html + slides_files/ next
  # to slides.qmd, gitignored) and quarto/scripts/serve.py serves decks/ as is.
  # With an output-dir Quarto walks the whole repo (.venv, .git) on every render.
  render:
    # leading "/": Quarto otherwise globs **/decks/**/… and walks the whole repo (.venv, .git)
    - "/decks/**/slides.qmd"
  # quarto/shim/_client.html (repo browser layers) is generated by quarto/scripts/gen_client.py
  # at setup/start/export — not as a pre-render step: Quarto re-scans the whole
  # project after one, which doubles the cost of every single-deck render.
  post-render:
    - python3 quarto/scripts/gen_index.py     # landing pages: decks/index.html + per category

filters:
  - path: quarto/filters/marp-compat.lua
    at: pre-ast             # before Quarto's own fenced-div sanity check

# Marp parity: CommonMark like Marp's markdown-it, so raw HTML/SVG blocks stay
# raw (pandoc markdown would parse `*`, `_`, `$` inside an inline <svg>);
# newline = <br> (markdown-it breaks:true); no typographic quotes/dashes.
from: commonmark_x+hard_line_breaks-smart

format:
  revealjs:
    slide-level: 0          # slides split on `---` only, exactly like Marp
    width: 1280
    height: 720
    margin: 0
    center: false
    transition: none
    background-transition: none
    hash-one-based-index: true
    navigation-mode: linear
    progress: false
    pdf-max-pages-per-slide: 1   # print view clips a tall slide like Marp, no extra pages
    auto-stretch: false          # Marp never grows a lone image to fill the slide
    slide-number: false     # in-slide Marp pagination instead (shim)
    code-line-numbers: false
    code-copy: false
    highlight-style: github-dark
    html-math-method:       # local MathJax 3 (quarto/scripts/setup.sh): offline + self-contained
      method: mathjax
      url: ../../../quarto/vendor/mathjax/tex-svg.js
    include-after-body:
      - quarto/shim/marp-compat.html   # Marp directives, slide ids (first: the layers need them)
      - quarto/shim/brand-link.html    # logo -> repo link on every slide, favicon
      - quarto/shim/_client.html       # control bar, edit mode, comments (generated)
