<text x="210" y="124" fill="#f0883e" font-size="12.5">the two branches cross at warmup_steps = 4000</text>
<text x="145" y="424" text-anchor="middle" fill="#f0883e" font-size="12">linear ramp up</text>
<text x="420" y="424" text-anchor="middle" fill="#3b82f6" font-size="12">decay proportional to 1 / sqrt(step)</text>
<text x="80" y="140" text-anchor="end" class="lrsc-d" font-size="11">peak</text>
<text x="80" y="155" text-anchor="end" class="lrsc-m lrsc-d" font-size="10">7.0e-4</text>
