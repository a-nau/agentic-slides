<text x="365" y="450" text-anchor="middle" class="lrsc-d" font-size="12">training step: 0 to 20000 shown, the base model runs to 100000</text>
<a href="https://ar5iv.labs.arxiv.org/html/1706.03762#S5.E3" target="_blank" data-tiphead="The width term" data-tip="A wider model has larger activations, so the schedule is scaled down by the square root of d_model. For the base model that is one over the square root of 512.">
<rect x="700" y="130" width="430" height="88" rx="10" fill="#151515" stroke="#2a2a2a" stroke-width="1.4"/>
<text x="722" y="156" class="lrsc-m" fill="#3fb950" font-size="13">d_model^(-0.5)</text>
<text x="722" y="180" class="lrsc-d" font-size="12.5">one global scale factor: wider models get a</text>
<text x="722" y="200" class="lrsc-d" font-size="12.5">proportionally smaller learning rate.</text>
</a>
<a href="https://ar5iv.labs.arxiv.org/html/1706.03762#S5.E3" target="_blank" data-tiphead="The warmup branch" data-tip="For the first warmup_steps updates this branch is the smaller of the two, and it grows linearly with the step number, so the learning rate ramps up from near zero.">
<rect x="700" y="234" width="430" height="88" rx="10" fill="#151515" stroke="#4a3520" stroke-width="1.4"/>
<text x="722" y="260" class="lrsc-m" fill="#f0883e" font-size="13">step . warmup^(-1.5)</text>
<text x="722" y="284" class="lrsc-d" font-size="12.5">the warmup branch. Smaller for the first 4000</text>
<text x="722" y="304" class="lrsc-d" font-size="12.5">steps, so it ramps the rate up linearly.</text>
</a>
<a href="https://ar5iv.labs.arxiv.org/html/1706.03762#S5.E3" target="_blank" data-tiphead="The decay branch" data-tip="After the crossover the inverse square root of the step number is the smaller term, so the rate decays slowly rather than being cut on a fixed schedule.">
<rect x="700" y="338" width="430" height="88" rx="10" fill="#151515" stroke="#20304a" stroke-width="1.4"/>
<text x="722" y="364" class="lrsc-m" fill="#3b82f6" font-size="13">step^(-0.5)</text>
<text x="722" y="388" class="lrsc-d" font-size="12.5">the decay branch. Smaller after step 4000, so</text>
<text x="722" y="408" class="lrsc-d" font-size="12.5">the rate falls off as one over sqrt(step).</text>
</a>
<a href="https://ar5iv.labs.arxiv.org/html/1706.03762#S5.SS3" target="_blank" data-tiphead="Why warm up" data-tip="A common later interpretation, not stated in the paper: Adam adapts each parameter using running estimates of the first and second moments of its gradient. Early on those estimates are built from very few samples, so a large step size can move parameters a long way on noisy evidence.">
<rect x="40" y="470" width="1090" height="126" rx="10" fill="#0d1117" stroke="#3b82f6" stroke-width="1.8"/>
<text x="64" y="496" class="lrsc-t" font-size="15">Why warm up? The paper gives no reason and no run without warmup</text>
<text x="64" y="522" class="lrsc-d" font-size="13">A common later interpretation: early on, Adam’s running estimates of the gradient moments come from a handful of steps,</text>
<text x="64" y="542" class="lrsc-d" font-size="13">so a full-size learning rate takes large, confident updates on very noisy evidence. The linear ramp keeps the first 4000</text>
<text x="64" y="562" class="lrsc-d" font-size="13">updates small while those estimates settle. After that the inverse square root branch takes over, so the rate decays</text>
<text x="64" y="582" class="lrsc-d" font-size="13">smoothly instead of being dropped on a hand-tuned schedule. The paper uses Adam with beta1 0.9, beta2 0.98, epsilon 1e-9.</text>
</a>
</svg>
