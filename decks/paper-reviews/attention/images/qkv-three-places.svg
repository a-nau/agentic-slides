<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" font-family="Inter, sans-serif">
<style>.qkvt-t{fill:#f0f0f0}.qkvt-m{font-family:'JetBrains Mono',monospace;font-weight:700}.qkvt-d{fill:#a0a0a0}.qkvt-d0{animation:qkvt-d0 6s linear infinite}.qkvt-r0{animation:qkvt-r0 6s linear infinite}.qkvt-d1{animation:qkvt-d1 6s linear infinite}.qkvt-r1{animation:qkvt-r1 6s linear infinite}.qkvt-d2{animation:qkvt-d2 6s linear infinite}.qkvt-r2{animation:qkvt-r2 6s linear infinite}.qkvt-x{animation:qkvt-x 6s linear infinite}@keyframes qkvt-d0{0.00%{stroke-dashoffset:1;opacity:1}6.67%{stroke-dashoffset:1;opacity:1}33.33%{stroke-dashoffset:0;opacity:1}88.33%{stroke-dashoffset:0;opacity:1}96.67%{stroke-dashoffset:0;opacity:0}100.00%{stroke-dashoffset:1;opacity:0}}@keyframes qkvt-r0{0.00%{opacity:0;transform:scale(1)}33.33%{opacity:0;transform:scale(1)}35.00%{opacity:.9;transform:scale(1)}50.00%{opacity:0;transform:scale(2.6)}100.00%{opacity:0;transform:scale(2.6)}}@keyframes qkvt-d1{0.00%{stroke-dashoffset:1;opacity:1}6.67%{stroke-dashoffset:1;opacity:1}33.33%{stroke-dashoffset:0;opacity:1}88.33%{stroke-dashoffset:0;opacity:1}96.67%{stroke-dashoffset:0;opacity:0}100.00%{stroke-dashoffset:1;opacity:0}}@keyframes qkvt-r1{0.00%{opacity:0;transform:scale(1)}33.33%{opacity:0;transform:scale(1)}35.00%{opacity:.9;transform:scale(1)}50.00%{opacity:0;transform:scale(2.6)}100.00%{opacity:0;transform:scale(2.6)}}@keyframes qkvt-d2{0.00%{stroke-dashoffset:1;opacity:1}6.67%{stroke-dashoffset:1;opacity:1}33.33%{stroke-dashoffset:0;opacity:1}88.33%{stroke-dashoffset:0;opacity:1}96.67%{stroke-dashoffset:0;opacity:0}100.00%{stroke-dashoffset:1;opacity:0}}@keyframes qkvt-r2{0.00%{opacity:0;transform:scale(1)}33.33%{opacity:0;transform:scale(1)}35.00%{opacity:.9;transform:scale(1)}50.00%{opacity:0;transform:scale(2.6)}100.00%{opacity:0;transform:scale(2.6)}}@keyframes qkvt-x{0.00%{opacity:1}33.33%{opacity:1}38.33%{opacity:.2}43.33%{opacity:1}48.33%{opacity:.2}53.33%{opacity:1}100.00%{opacity:1}}@media (prefers-reduced-motion: reduce){[class*="qkvt-"]{animation:none !important}}</style>
<rect x="0" y="0" width="1160" height="600" fill="#111111"/>
<a class="qkvt-p0" href="https://ar5iv.labs.arxiv.org/html/1706.03762#S3.SS2.SSS3" target="_blank" data-tiphead="Encoder self-attention" data-tip="Q, K and V are three different learned projections of one and the same tensor: the output of the previous encoder layer. No causal mask here, so every position sees every position of the sentence; only padding, added to fill out a batch, is hidden from the keys in implementations, a detail the paper leaves out.">
<rect x="20" y="30" width="370" height="540" rx="14" fill="#141414" stroke="#3b82f6" stroke-width="2"/>
<text x="205" y="64" text-anchor="middle" fill="#3b82f6" font-size="16" font-weight="700">Encoder self-attention</text>
<text x="205" y="86" text-anchor="middle" class="qkvt-d" font-size="11.5">Sec 3.2.3, second bullet</text>
</a>
<a class="qkvt-p1" href="https://ar5iv.labs.arxiv.org/html/1706.03762#S3.SS2.SSS3" target="_blank" data-tiphead="Masked decoder self-attention" data-tip="Same shape as encoder self-attention: all three come from the previous decoder layer. The difference is the mask, which sets every score for a later position to minus infinity before the softmax.">
<rect x="395" y="30" width="370" height="540" rx="14" fill="#141414" stroke="#f0883e" stroke-width="2"/>
<text x="580" y="64" text-anchor="middle" fill="#f0883e" font-size="16" font-weight="700">Masked decoder self-attention</text>
<text x="580" y="86" text-anchor="middle" class="qkvt-d" font-size="11.5">Sec 3.2.3, third bullet</text>
</a>
<a class="qkvt-p2" href="https://ar5iv.labs.arxiv.org/html/1706.03762#S3.SS2.SSS3" target="_blank" data-tiphead="Encoder-decoder attention" data-tip="The asymmetric one. Queries come from the previous decoder layer; the memory keys and values come from the output of the encoder stack. This is the only place the two stacks exchange information.">
<rect x="770" y="30" width="370" height="540" rx="14" fill="#141414" stroke="#bc8cff" stroke-width="2"/>
<text x="955" y="64" text-anchor="middle" fill="#bc8cff" font-size="16" font-weight="700">Encoder-decoder attention</text>
<text x="955" y="86" text-anchor="middle" class="qkvt-d" font-size="11.5">Sec 3.2.3, first bullet</text>
</a>
<a class="qkvt-p0" href="https://ar5iv.labs.arxiv.org/html/1706.03762#S3.SS2.SSS3" target="_blank" data-tiphead="Where Q comes from" data-tip="The encoder has no external source to query: the queries are a projection of the layer below, exactly like the keys and values.">
<rect x="35" y="112" width="340" height="56" rx="9" fill="#1a1a1a" stroke="#20304a" stroke-width="1.6"/>
<text x="57" y="136" class="qkvt-t" font-size="14"><tspan class="qkvt-m" fill="#3b82f6" font-size="15">Q</tspan><tspan dx="12">from the previous encoder layer</tspan></text>
<text x="57" y="156" class="qkvt-d" font-size="11.5">layer 1 sees embeddings plus positional encoding</text>
</a>
<a class="qkvt-p0" href="https://ar5iv.labs.arxiv.org/html/1706.03762#S3.SS2.SSS3" target="_blank" data-tiphead="Where K and V come from" data-tip="The paper states it plainly: in a self-attention layer all of the keys, values and queries come from the same place, the output of the previous layer in the encoder.">
<rect x="35" y="178" width="340" height="56" rx="9" fill="#1a1a1a" stroke="#20304a" stroke-width="1.6"/>
<text x="57" y="202" class="qkvt-t" font-size="14"><tspan class="qkvt-m" fill="#3b82f6" font-size="15">K, V</tspan><tspan dx="12">from the same previous layer</tspan></text>
<text x="57" y="222" class="qkvt-d" font-size="11.5">same tensor as Q, three different projection matrices</text>
</a>
<a class="qkvt-p1" href="https://ar5iv.labs.arxiv.org/html/1706.03762#S3.SS2.SSS3" target="_blank" data-tiphead="Where Q comes from" data-tip="A projection of the decoder representation of the token being predicted. Under teacher forcing the whole target sequence is present at once, which is why a mask is needed at all.">
<rect x="410" y="112" width="340" height="56" rx="9" fill="#1a1a1a" stroke="#4a3520" stroke-width="1.6"/>
<text x="432" y="136" class="qkvt-t" font-size="14"><tspan class="qkvt-m" fill="#f0883e" font-size="15">Q</tspan><tspan dx="12">from the previous decoder layer</tspan></text>
<text x="432" y="156" class="qkvt-d" font-size="11.5">one query per target position generated so far</text>
</a>
<a class="qkvt-p1" href="https://ar5iv.labs.arxiv.org/html/1706.03762#S3.SS2.SSS3" target="_blank" data-tiphead="Where K and V come from" data-tip="Also the previous decoder layer. The restriction to positions up to and including i is imposed by the mask inside scaled dot-product attention, not by where the tensors come from.">
<rect x="410" y="178" width="340" height="56" rx="9" fill="#1a1a1a" stroke="#4a3520" stroke-width="1.6"/>
<text x="432" y="202" class="qkvt-t" font-size="14"><tspan class="qkvt-m" fill="#f0883e" font-size="15">K, V</tspan><tspan dx="12">from the same previous layer</tspan></text>
<text x="432" y="222" class="qkvt-d" font-size="11.5">the mask, not the source, is what makes it causal</text>
</a>
<a class="qkvt-p2" href="https://ar5iv.labs.arxiv.org/html/1706.03762#S3.SS2.SSS3" target="_blank" data-tiphead="Where Q comes from" data-tip="The queries come from the previous decoder layer, so the target side decides what to look for in the source sentence.">
<rect x="785" y="112" width="340" height="56" rx="9" fill="#1a1a1a" stroke="#3d2f52" stroke-width="1.6"/>
<text x="807" y="136" class="qkvt-t" font-size="14"><tspan class="qkvt-m" fill="#bc8cff" font-size="15">Q</tspan><tspan dx="12">from the previous decoder layer</tspan></text>
<text x="807" y="156" class="qkvt-d" font-size="11.5">the target side asks the question</text>
</a>
<a class="qkvt-p2" href="https://ar5iv.labs.arxiv.org/html/1706.03762#S3.SS2.SSS3" target="_blank" data-tiphead="Where K and V come from" data-tip="The memory keys and values come from the output of the encoder stack, computed once for the whole source sentence and reused at every decoder layer and every decoding step.">
<rect x="785" y="178" width="340" height="56" rx="9" fill="#1a1a1a" stroke="#3d2f52" stroke-width="1.6"/>
<text x="807" y="202" class="qkvt-t" font-size="14"><tspan class="qkvt-m" fill="#bc8cff" font-size="15">K, V</tspan><tspan dx="12">from the encoder stack output</tspan></text>
<text x="807" y="222" class="qkvt-d" font-size="11.5">the source side supplies the answer</text>
</a>
<g class="qkvt-p0"><path pathLength="1" stroke-dasharray="1" class="qkvt-d0" d="M198,312 Q135,258 74,312" stroke="#3b82f6" stroke-width="1.8" fill="none"/></g>
<g class="qkvt-p0"><path pathLength="1" stroke-dasharray="1" class="qkvt-d0" d="M199,312 Q167,272 137,312" stroke="#3b82f6" stroke-width="1.8" fill="none"/></g>
<g class="qkvt-p0"><path pathLength="1" stroke-dasharray="1" class="qkvt-d0" d="M211,312 Q243,272 273,312" stroke="#3b82f6" stroke-width="1.8" fill="none"/></g>
<g class="qkvt-p0"><path pathLength="1" stroke-dasharray="1" class="qkvt-d0" d="M212,312 Q275,258 336,312" stroke="#3b82f6" stroke-width="1.8" fill="none"/></g>
<g class="qkvt-p0"><path pathLength="1" stroke-dasharray="1" class="qkvt-d0" d="M205,309 Q188,286 205,284 Q222,286 205,309" stroke="#3b82f6" stroke-width="1.8" fill="none"/></g>
<circle class="qkvt-p0" cx="70" cy="320" r="9" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
<circle class="qkvt-p0" cx="135" cy="320" r="9" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
<circle class="qkvt-p0" cx="205" cy="320" r="10" fill="#3b82f6" stroke="#3b82f6" stroke-width="2"/>
<circle class="qkvt-r0" cx="205" cy="320" r="10" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0" style="transform-box:fill-box;transform-origin:center"/>
<circle class="qkvt-p0" cx="275" cy="320" r="9" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
<circle class="qkvt-p0" cx="340" cy="320" r="9" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
<text x="205" y="352" text-anchor="middle" class="qkvt-p0 qkvt-d" font-size="11.5">every position, no mask</text>
<g class="qkvt-p1"><path pathLength="1" stroke-dasharray="1" class="qkvt-d1" d="M637,312 Q544,250 456,312" stroke="#f0883e" stroke-width="1.8" fill="none"/></g>
<g class="qkvt-p1"><path pathLength="1" stroke-dasharray="1" class="qkvt-d1" d="M638,312 Q575,262 518,312" stroke="#f0883e" stroke-width="1.8" fill="none"/></g>
<g class="qkvt-p1"><path pathLength="1" stroke-dasharray="1" class="qkvt-d1" d="M639,313 Q611,282 583,313" stroke="#f0883e" stroke-width="1.8" fill="none"/></g>
<g class="qkvt-p1"><path pathLength="1" stroke-dasharray="1" class="qkvt-d1" d="M645,309 Q628,286 645,284 Q662,286 645,309" stroke="#f0883e" stroke-width="1.8" fill="none"/></g>
<circle class="qkvt-p1" cx="450" cy="320" r="9" fill="#1a1a1a" stroke="#f0883e" stroke-width="2"/>
<circle class="qkvt-p1" cx="512" cy="320" r="9" fill="#1a1a1a" stroke="#f0883e" stroke-width="2"/>
<circle class="qkvt-p1" cx="577" cy="320" r="9" fill="#1a1a1a" stroke="#f0883e" stroke-width="2"/>
<circle class="qkvt-p1" cx="645" cy="320" r="10" fill="#f0883e" stroke="#f0883e" stroke-width="2"/>
<circle class="qkvt-r1" cx="645" cy="320" r="10" fill="none" stroke="#f0883e" stroke-width="2" opacity="0" style="transform-box:fill-box;transform-origin:center"/>
<circle class="qkvt-p1" cx="712" cy="320" r="9" fill="#1a1a1a" stroke="#444" stroke-width="2" stroke-dasharray="4 3"/>
<g class="qkvt-p1"><g class="qkvt-x"><path d="M705,313 L719,327" stroke="#f85149" stroke-width="2"/></g></g>
<g class="qkvt-p1"><g class="qkvt-x"><path d="M719,313 L705,327" stroke="#f85149" stroke-width="2"/></g></g>
<text x="560" y="352" text-anchor="middle" class="qkvt-p1 qkvt-d" font-size="11.5">positions 1..i only</text>
<g class="qkvt-p1"><g class="qkvt-x"><text x="712" y="352" text-anchor="middle" fill="#f85149" font-size="11">blocked</text></g></g>
<text x="955" y="252" text-anchor="middle" class="qkvt-p2 qkvt-d" font-size="11">encoder positions</text>
<g class="qkvt-p2"><path pathLength="1" stroke-dasharray="1" class="qkvt-d2" d="M921,359 Q876,320 833,281" stroke="#bc8cff" stroke-width="1.8" fill="none"/></g>
<g class="qkvt-p2"><path pathLength="1" stroke-dasharray="1" class="qkvt-d2" d="M925,359 Q910,320 894,281" stroke="#bc8cff" stroke-width="1.8" fill="none"/></g>
<g class="qkvt-p2"><path pathLength="1" stroke-dasharray="1" class="qkvt-d2" d="M929,359 Q944,320 959,281" stroke="#bc8cff" stroke-width="1.8" fill="none"/></g>
<g class="qkvt-p2"><path pathLength="1" stroke-dasharray="1" class="qkvt-d2" d="M933,359 Q978,320 1022,281" stroke="#bc8cff" stroke-width="1.8" fill="none"/></g>
<g class="qkvt-p2"><path pathLength="1" stroke-dasharray="1" class="qkvt-d2" d="M936,359 Q1012,320 1086,281" stroke="#bc8cff" stroke-width="1.8" fill="none"/></g>
<circle class="qkvt-p2" cx="830" cy="272" r="9" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
<circle class="qkvt-p2" cx="892" cy="272" r="9" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
<circle class="qkvt-p2" cx="957" cy="272" r="9" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
<circle class="qkvt-p2" cx="1021" cy="272" r="9" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
<circle class="qkvt-p2" cx="1086" cy="272" r="9" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/>
<circle class="qkvt-p2" cx="862" cy="368" r="9" fill="#1a1a1a" stroke="#bc8cff" stroke-width="2"/>
<circle class="qkvt-p2" cx="927" cy="368" r="10" fill="#bc8cff" stroke="#bc8cff" stroke-width="2"/>
<circle class="qkvt-r2" cx="927" cy="368" r="10" fill="none" stroke="#bc8cff" stroke-width="2" opacity="0" style="transform-box:fill-box;transform-origin:center"/>
<circle class="qkvt-p2" cx="992" cy="368" r="9" fill="#1a1a1a" stroke="#bc8cff" stroke-width="2"/>
<circle class="qkvt-p2" cx="1057" cy="368" r="9" fill="#1a1a1a" stroke="#bc8cff" stroke-width="2"/>
<text x="955" y="398" text-anchor="middle" class="qkvt-p2 qkvt-d" font-size="11">decoder positions</text>
<text x="42" y="452" class="qkvt-p0 qkvt-t" font-size="12.5">Every position attends to every position of the</text>
<text x="42" y="474" class="qkvt-p0 qkvt-t" font-size="12.5">layer below, itself included. This is exactly</text>
<text x="42" y="496" class="qkvt-p0 qkvt-t" font-size="12.5">what replaces recurrence inside the encoder.</text>
<text x="417" y="452" class="qkvt-p1 qkvt-t" font-size="12.5">Same tensor feeds Q, K and V as in the encoder.</text>
<text x="417" y="474" class="qkvt-p1 qkvt-t" font-size="12.5">Scores for later positions are set to minus</text>
<text x="417" y="496" class="qkvt-p1 qkvt-t" font-size="12.5">infinity before the softmax, so position i can</text>
<text x="417" y="518" class="qkvt-p1 qkvt-t" font-size="12.5">only see positions 1 through i.</text>
<text x="792" y="452" class="qkvt-p2 qkvt-t" font-size="12.5">The only path from source to target sentence.</text>
<text x="792" y="474" class="qkvt-p2 qkvt-t" font-size="12.5">Queries ask from the decoder side, keys and</text>
<text x="792" y="496" class="qkvt-p2 qkvt-t" font-size="12.5">values answer from the encoder side, so every</text>
<text x="792" y="518" class="qkvt-p2 qkvt-t" font-size="12.5">decoder position can read the whole input.</text>
</svg>
