<rect x="230" y="460" width="36" height="36" fill="#1d3b66"/><rect x="266" y="460" width="36" height="36" fill="#1d3b66"/><rect x="302" y="460" width="36" height="36" fill="#1d3b66"/><rect x="338" y="460" width="36" height="36" fill="#1d3b66"/><rect x="374" y="460" width="36" height="36" fill="#1d3b66"/>
</g>
<g fill="#f85149" font-size="13" text-anchor="middle"><text x="284" y="339">x</text><text x="320" y="339">x</text><text x="356" y="339">x</text><text x="392" y="339">x</text><text x="320" y="375" font-weight="700">x</text><text x="356" y="375">x</text><text x="392" y="375">x</text><text x="356" y="411">x</text><text x="392" y="411">x</text><text x="392" y="447">x</text></g>
<text x="430" y="340" class="tf-d" font-size="12"><tspan fill="#3b82f6">blue</tspan>: allowed, may read</text>
<text x="430" y="360" class="tf-d" font-size="12"><tspan fill="#f85149">x</tspan>: blocked, masked out</text>
<text x="430" y="388" class="tf-d" font-size="12">diagonal: its own input,</text>
<text x="430" y="406" class="tf-d" font-size="12">token i-1, safe to read</text>
<text x="40" y="530" class="tf-d" font-size="13">Without the mask, position 2 could read Gesetz at input 3, the very</text>
<text x="40" y="550" class="tf-d" font-size="13">word it is trained to predict, and learn to copy instead of translate.</text>
<text x="40" y="570" class="tf-d" font-size="13">With it, one pass trains all five predictions without leaking answers.</text>
</a>
<a href="https://ar5iv.labs.arxiv.org/html/1706.03762#S3" target="_blank">
<rect x="660" y="16" width="484" height="568" rx="12" fill="#0d1117" stroke="#3fb950" stroke-width="1.6"/>
<text x="684" y="48" class="tf-lab" fill="#3fb950">INFERENCE: NO REFERENCE, ONE TOKEN PER STEP</text>
<text x="684" y="80" class="tf-d" font-size="12">written so far</text><text x="1040" y="80" class="tf-d" font-size="12">next token</text>
<g class="tf-anim tf-s1" opacity="1"><text x="684" y="113" class="tf-d tf-m" font-size="11">step 1</text><rect x="736" y="92" width="270" height="32" rx="6" fill="#101824" stroke="#20304a"/><text x="750" y="113" class="tf-m" fill="#f0f0f0" font-size="13">&lt;s&gt;</text><line x1="1010" y1="108" x2="1036" y2="108" stroke="#3fb950" stroke-width="1.6" marker-end="url(#tf-ag)"/><rect x="1040" y="92" width="88" height="32" rx="6" fill="#0f1f16" stroke="#3fb950"/><text x="1084" y="113" text-anchor="middle" class="tf-tok" font-size="13">Das</text></g>
<g class="tf-anim tf-s2" opacity="1"><text x="684" y="169" class="tf-d tf-m" font-size="11">step 2</text><rect x="736" y="148" width="270" height="32" rx="6" fill="#101824" stroke="#20304a"/><text x="750" y="169" class="tf-m" fill="#f0f0f0" font-size="13">&lt;s&gt; Das</text><line x1="1010" y1="164" x2="1036" y2="164" stroke="#3fb950" stroke-width="1.6" marker-end="url(#tf-ag)"/><rect x="1040" y="148" width="88" height="32" rx="6" fill="#0f1f16" stroke="#3fb950"/><text x="1084" y="169" text-anchor="middle" class="tf-tok" font-size="13">Gesetz</text></g>
<g class="tf-anim tf-s3" opacity="1"><text x="684" y="225" class="tf-d tf-m" font-size="11">step 3</text><rect x="736" y="204" width="270" height="32" rx="6" fill="#101824" stroke="#20304a"/><text x="750" y="225" class="tf-m" fill="#f0f0f0" font-size="13">&lt;s&gt; Das Gesetz</text><line x1="1010" y1="220" x2="1036" y2="220" stroke="#3fb950" stroke-width="1.6" marker-end="url(#tf-ag)"/><rect x="1040" y="204" width="88" height="32" rx="6" fill="#0f1f16" stroke="#3fb950"/><text x="1084" y="225" text-anchor="middle" class="tf-tok" font-size="13">wird</text></g>
<g class="tf-anim tf-s4" opacity="1"><text x="684" y="281" class="tf-d tf-m" font-size="11">step 4</text><rect x="736" y="260" width="270" height="32" rx="6" fill="#101824" stroke="#20304a"/><text x="750" y="281" class="tf-m" fill="#f0f0f0" font-size="13">&lt;s&gt; Das Gesetz wird</text><line x1="1010" y1="276" x2="1036" y2="276" stroke="#3fb950" stroke-width="1.6" marker-end="url(#tf-ag)"/><rect x="1040" y="260" width="88" height="32" rx="6" fill="#0f1f16" stroke="#3fb950"/><text x="1084" y="281" text-anchor="middle" class="tf-tok" font-size="13">nie</text></g>
<g class="tf-anim tf-s5" opacity="1"><text x="684" y="337" class="tf-d tf-m" font-size="11">step 5</text><rect x="736" y="316" width="270" height="32" rx="6" fill="#101824" stroke="#20304a"/><text x="750" y="337" class="tf-m" fill="#f0f0f0" font-size="13">&lt;s&gt; Das Gesetz wird nie</text><line x1="1010" y1="332" x2="1036" y2="332" stroke="#3fb950" stroke-width="1.6" marker-end="url(#tf-ag)"/><rect x="1040" y="316" width="88" height="32" rx="6" fill="#0f1f16" stroke="#3fb950"/><text x="1084" y="337" text-anchor="middle" class="tf-tok" font-size="13">perfekt</text></g>
<text x="684" y="400" class="tf-d" font-size="13">Each step runs the decoder again and feeds the</text>
<text x="684" y="420" class="tf-d" font-size="13">new token back in. The paper: at each step the</text>
<text x="684" y="440" class="tf-d" font-size="13">model consumes the previously generated symbols</text>
<text x="684" y="460" class="tf-d" font-size="13">as additional input when generating the next.</text>
<text x="684" y="500" fill="#f0f0f0" font-size="13" font-weight="700">So decoding stays sequential in the output length;</text>
<text x="684" y="520" fill="#f0f0f0" font-size="13" font-weight="700">the one-pass shortcut exists only in training,</text>
<text x="684" y="540" fill="#f0f0f0" font-size="13" font-weight="700">where the reference translation is known.</text>
</a>
<text x="1136" y="576" text-anchor="end" fill="#f0883e" font-size="11.5">German tokens illustrative; &lt;s&gt; marks the start of the output</text>
