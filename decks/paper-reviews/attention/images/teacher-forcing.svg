<text x="40" y="234" class="tf-d" font-size="12">decoder input = the reference shifted right by one</text>
<text x="40" y="276" class="tf-lab" fill="#f0883e">THE MASK: WHICH INPUTS POSITION i MAY READ</text>
<text x="248" y="306" text-anchor="middle" class="tf-d tf-m" font-size="11">&lt;s&gt;</text><text x="284" y="306" text-anchor="middle" class="tf-d" font-size="11">Das</text><text x="320" y="306" text-anchor="middle" class="tf-d" font-size="11">Gesetz</text><text x="356" y="306" text-anchor="middle" class="tf-d" font-size="11">wird</text><text x="392" y="306" text-anchor="middle" class="tf-d" font-size="11">nie</text>
<text x="222" y="337" text-anchor="end" class="tf-d tf-m" font-size="11">i=1</text><text x="222" y="373" text-anchor="end" class="tf-d tf-m" font-size="11">i=2</text><text x="222" y="409" text-anchor="end" class="tf-d tf-m" font-size="11">i=3</text><text x="222" y="445" text-anchor="end" class="tf-d tf-m" font-size="11">i=4</text><text x="222" y="481" text-anchor="end" class="tf-d tf-m" font-size="11">i=5</text>
