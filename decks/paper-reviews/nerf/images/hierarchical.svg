opacity:1}}.hier-a-f7{animation:hier-a-f7 10s linear infinite}@keyframes hier-a-f8{0.0%{opacity:0.25}71.2%{opacity:0.25}73.2%{opacity:1}100.0%{opacity:1}}.hier-a-f8{animation:hier-a-f8 10s linear infinite}@keyframes hier-a-f9{0.0%{opacity:0.25}72.8%{opacity:0.25}74.8%{opacity:1}100.0%{opacity:1}}.hier-a-f9{animation:hier-a-f9 10s linear infinite}@keyframes hier-a-f10{0.0%{opacity:0.25}74.5%{opacity:0.25}76.5%{opacity:1}100.0%{opacity:1}}.hier-a-f10{animation:hier-a-f10 10s linear infinite}@keyframes hier-a-f11{0.0%{opacity:0.25}76.1%{opacity:0.25}78.1%{opacity:1}100.0%{opacity:1}}.hier-a-f11{animation:hier-a-f11 10s linear infinite}@keyframes hier-a-f12{0.0%{opacity:0.25}77.8%{opacity:0.25}79.8%{opacity:1}100.0%{opacity:1}}.hier-a-f12{animation:hier-a-f12 10s linear infinite}@keyframes hier-a-f13{0.0%{opacity:0.25}79.4%{opacity:0.25}81.4%{opacity:1}100.0%{opacity:1}}.hier-a-f13{animation:hier-a-f13 10s linear infinite}@keyframes hier-a-f14{0.0%{opacity:0.25}81.1%{opacity:0.25}83.1%{opacity:1}100.0%{opacity:1}}.hier-a-f14{animation:hier-a-f14 10s linear infinite}@keyframes hier-a-f15{0.0%{opacity:0.25}82.7%{opacity:0.25}84.7%{opacity:1}100.0%{opacity:1}}.hier-a-f15{animation:hier-a-f15 10s linear infinite}@keyframes hier-a-f16{0.0%{opacity:0.25}84.4%{opacity:0.25}86.4%{opacity:1}100.0%{opacity:1}}.hier-a-f16{animation:hier-a-f16 10s linear infinite}</style>
<defs>
<marker id="hg" markerWidth="12" markerHeight="12" refX="9" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#3b82f6"/></marker>
</defs>
<rect x="0" y="0" width="1160" height="600" fill="#111111"/>
<text x="18" y="28" class="hier-hd" font-size="16">HIERARCHICAL SAMPLING &#8212; the coarse net says where the fine one looks</text>
<a href="https://ar5iv.labs.arxiv.org/html/2003.08934#S5.SS2" target="_blank"><text x="1142" y="28" text-anchor="end" class="hier-d" font-size="14">Sec. 5.2, Eq. 5</text></a>
<a href="https://ar5iv.labs.arxiv.org/html/2003.08934#S5.SS2" target="_blank" data-tiphead="Step 1: the coarse network" data-tip="Sixty-four samples are spread over the whole ray by stratified sampling and pushed through the coarse network. Most of them land in empty space or behind the first surface, where they contribute almost nothing to the pixel, so this pass is deliberately cheap and deliberately wasteful.">
<rect x="18" y="44" width="1122" height="128" rx="10" fill="#151515" stroke="#3fb950" stroke-width="1.6"/>
<text x="42" y="74" fill="#3fb950" font-size="17" font-weight="700">1 &#183; Coarse network: 64 stratified samples, spread evenly and mostly wasted</text>
<g data-tiphead="Evenly spread samples" data-tip="Sixty-four positions covering the entire near-to-far interval. Most of them are in air or behind the surface and contribute nothing.">
<path d="M60,122 L1112,122" stroke="#666666" stroke-width="2"/>
<rect x="612" y="104" width="40" height="36" rx="3" fill="#f0883e" opacity="0.5"/>
<circle opacity="0.25" class="hier-a-c0" cx="90" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c1" cx="152" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c2" cx="214" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c3" cx="276" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c4" cx="338" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c5" cx="400" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c6" cx="462" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c7" cx="524" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c8" cx="586" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c9" cx="648" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c10" cx="710" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c11" cx="772" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c12" cx="834" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c13" cx="896" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c14" cx="958" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c15" cx="1020" cy="122" r="5" fill="#3fb950"/><circle opacity="0.25" class="hier-a-c16" cx="1082" cy="122" r="5" fill="#3fb950"/>
</g>
<text x="632" y="98" text-anchor="middle" fill="#f0883e" font-size="14">the surface</text>
<text x="42" y="158" class="hier-d" font-size="15">Free space and occluded regions that do not contribute to the image are still sampled, over and over, at every step.</text>
</a>
<a href="https://ar5iv.labs.arxiv.org/html/2003.08934#S5.E5" target="_blank" data-tiphead="Step 2: reuse the weights as a distribution" data-tip="The coarse render is rewritten as a weighted sum of its sample colours. Those weights are already the product of transmittance and opacity, so they are large exactly where the ray is likely to stop. Normalising them by their sum turns them into a piecewise-constant PDF along the ray. Nothing new is computed here.">
<rect x="18" y="188" width="1122" height="152" rx="10" fill="#151515" stroke="#93c5fd" stroke-width="1.6"/>
<text x="42" y="218" fill="#93c5fd" font-size="17" font-weight="700">2 &#183; The weights you already computed are a probability distribution</text>
<text x="42" y="252" class="hier-m" fill="#f0f0f0" font-size="17">&#264;&#7580;(r) = &#931; w&#7522; c&#7522;&#160;&#160;with&#160;&#160;w&#7522; = T&#7522; (1 - exp(-&#963;&#7522;&#948;&#7522;))</text>
<path d="M700,248 L740,248" stroke="#3b82f6" stroke-width="2.2" marker-end="url(#hg)" fill="none"/>
<g data-tiphead="Normalisation" data-tip="Divide each weight by the sum of the weights along that ray. The result integrates to one, which is all a probability density needs.">
<rect x="752" y="228" width="364" height="34" rx="7" fill="#0d1117" stroke="#93c5fd" stroke-width="1.4"/>
<text x="934" y="251" text-anchor="middle" class="hier-m" fill="#93c5fd" font-size="16">normalise: &#373;&#7522; = w&#7522; / &#931; w&#11002;</text>
</g>
<g data-tiphead="The resulting PDF" data-tip="Piecewise constant along the ray and peaked at whatever the coarse pass believes is the first visible surface.">
<path d="M60,314 L1112,314" stroke="#3a3a3a" stroke-width="1.2"/>
<rect opacity="0.25" class="hier-a-p0" x="90" y="311" width="46" height="3" fill="#93c5fd"/><rect opacity="0.25" class="hier-a-p1" x="152" y="310" width="46" height="4" fill="#93c5fd"/><rect opacity="0.25" class="hier-a-p2" x="214" y="308" width="46" height="6" fill="#93c5fd"/><rect opacity="0.25" class="hier-a-p3" x="276" y="307" width="46" height="7" fill="#93c5fd"/><rect opacity="0.25" class="hier-a-p4" x="338" y="304" width="46" height="10" fill="#93c5fd"/><rect opacity="0.25" class="hier-a-p5" x="400" y="300" width="46" height="14" fill="#93c5fd"/><rect opacity="0.25" class="hier-a-p6" x="462" y="294" width="46" height="20" fill="#93c5fd"/><rect opacity="0.25" class="hier-a-p7" x="524" y="282" width="46" height="32" fill="#93c5fd"/><rect opacity="0.25" class="hier-a-p8" x="586" y="276" width="46" height="38" fill="#93c5fd"/><rect opacity="0.25" class="hier-a-p9" x="648" y="292" width="46" height="22" fill="#93c5fd"/><rect opacity="0.25" class="hier-a-p10" x="710" y="308" width="46" height="6" fill="#93c5fd"/><rect opacity="0.25" class="hier-a-p11" x="772" y="311" width="46" height="3" fill="#93c5fd"/><rect opacity="0.25" class="hier-a-p12" x="834" y="312" width="46" height="2" fill="#93c5fd"/><rect opacity="0.25" class="hier-a-p13" x="896" y="313" width="46" height="1" fill="#93c5fd"/><rect opacity="0.25" class="hier-a-p14" x="958" y="313" width="46" height="1" fill="#93c5fd"/><rect opacity="0.25" class="hier-a-p15" x="1020" y="313" width="46" height="1" fill="#93c5fd"/>
</g>
<text x="42" y="332" class="hier-d" font-size="15">A piecewise-constant PDF along the ray, for free.</text>
</a>
<a href="https://ar5iv.labs.arxiv.org/html/2003.08934#S5.SS2" target="_blank" data-tiphead="Step 3: the fine network" data-tip="A second set of 128 locations is drawn from that PDF by inverse transform sampling, so they cluster where the coarse pass thought the surface was. The fine network is then evaluated on the union of both sets, 192 samples, and its render is the one you look at.">
<rect x="18" y="356" width="1122" height="128" rx="10" fill="#151515" stroke="#bc8cff" stroke-width="1.6"/>
<text x="42" y="386" fill="#bc8cff" font-size="17" font-weight="700">3 &#183; Fine network: 128 more samples drawn from that PDF by inverse transform sampling</text>
<g data-tiphead="Concentrated samples" data-tip="Coarse samples first, then the PDF built from their weights, then the fine samples where that PDF peaks. The same total budget, spent where the pixel colour is actually decided. A handful still land elsewhere, because the evenly spread coarse samples stay in the union.">
<path d="M60,430 L1112,430" stroke="#666666" stroke-width="2"/>
<rect x="612" y="412" width="40" height="36" rx="3" fill="#f0883e" opacity="0.5"/>
<circle opacity="0.25" class="hier-a-f0" cx="150" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f1" cx="330" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f2" cx="446" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f3" cx="500" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f4" cx="530" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f5" cx="552" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f6" cx="572" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f7" cx="590" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f8" cx="606" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f9" cx="622" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f10" cx="638" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f11" cx="656" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f12" cx="676" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f13" cx="700" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f14" cx="740" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f15" cx="820" cy="430" r="5" fill="#bc8cff"/><circle opacity="0.25" class="hier-a-f16" cx="980" cy="430" r="5" fill="#bc8cff"/>
</g>
<text x="42" y="470" class="hier-d" font-size="15">Fine network runs on the union, 192 samples per ray; its render is the one you see. Released code: sorted, &#948; recomputed.</text>
</a>
<rect x="18" y="500" width="551" height="82" rx="10" fill="#0d1117" stroke="#3b82f6" stroke-width="1.6"/>
<text x="42" y="528" class="hier-t" font-size="16">Both networks are trained, together</text>
<text x="42" y="554" class="hier-d" font-size="15">Eq. 6 scores the coarse render too. Otherwise the coarse</text>
<text x="42" y="574" class="hier-d" font-size="15">weights would drift and stop pointing at the surface.</text>
<rect x="589" y="500" width="551" height="82" rx="10" fill="#0d1117" stroke="#f0883e" stroke-width="1.6"/>
<text x="613" y="528" class="hier-t" font-size="16">Not quite importance sampling</text>
<text x="613" y="554" class="hier-d" font-size="15">The draws just become extra points of a finer, uneven grid</text>
<text x="613" y="574" class="hier-d" font-size="15">for Eq. 3; nothing is reweighted by 1/pdf as an estimator.</text>
</svg>
