<text x="614" y="364" class="head-ax">at the time of submission — this entry won 1st place in ILSVRC 2015</text>
</a>
<a href="https://ar5iv.labs.arxiv.org/html/1512.03385#S4.SS1" target="_blank" data-tiphead="Four different evaluation protocols" data-tip="The paper reports 10-crop testing in Tables 2 and 3, single-model validation results in Table 4, ensemble test-server results in Table 5, and fully-convolutional multi-scale testing for its best results. Comparing across them without saying so is the easiest mistake to make with this paper.">
<rect x="40" y="410" width="1080" height="176" rx="12" fill="#151515" stroke="#3b82f6" stroke-width="1.8"/>
<text x="66" y="442" fill="#3b82f6" font-size="15.5" font-weight="700">Whichever you quote, say which — this paper uses four different protocols</text>
<text x="66" y="474" class="head-d" font-size="13.5">3.57% is an ENSEMBLE on the TEST set. The best single model in the paper is the 152-layer ResNet at 4.49% top-5 on validation.</text>
<text x="66" y="500" class="head-d" font-size="13.5">Tables 2 and 3 are different again: 10-crop testing, used for the like-for-like comparison studies rather than for the headline.</text>
<text x="66" y="526" class="head-d" font-size="13.5">Table 4 uses the best-results protocol, fully-convolutional with 5 scales averaged: ResNet-34 B is 24.52 in Table 3, 21.84 in Table 4.</text>
<text x="66" y="558" fill="#f0f0f0" font-size="13.5">Before you compare any number in this paper to any other, check four things: validation or test, single or ensemble, 10-crop or</text>
<text x="66" y="578" fill="#f0f0f0" font-size="13.5">multi-scale, top-1 or top-5. All four vary between tables.</text>
</a>
</svg>
