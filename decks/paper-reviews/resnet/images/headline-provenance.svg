<text x="64" y="358" class="head-ax">the best single model in the paper; the paper calls it better than</text>
<text x="64" y="376" class="head-ax">every previous ensemble — a validation-vs-test comparison</text>
</a>
<a href="https://ar5iv.labs.arxiv.org/html/1512.03385#S4.SS1" target="_blank" data-tiphead="Table 5 — ensembles" data-tip="Error rates in percent of ensembles. The top-5 error is on the test set of ImageNet and reported by the test server. This is where the 3.57% headline comes from.">
