<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" font-family="Inter, sans-serif">
<style>.t{fill:#f0f0f0;font-weight:700}.d{fill:#a0a0a0}.mu{fill:#666666}.m{font-family:'JetBrains Mono',monospace;fill:#93c5fd}.ar-b{cursor:help}.ar-b:hover rect{stroke:#fff}</style>
<rect x="0" y="0" width="1160" height="600" fill="#111111"/><defs><marker id="ar-a" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#666666"/></marker></defs><rect x="590" y="46" width="260" height="404" rx="18" fill="none" stroke="#3fb950" stroke-opacity=".35" stroke-dasharray="6 6"/><text x="720" y="476" class="mu" font-size="13" text-anchor="middle">this machine only; SLIDES_HOST=0.0.0.0</text><text x="720" y="494" class="mu" font-size="13" text-anchor="middle">opens it to the network</text><text x="40" y="30" font-size="14" font-weight="700" letter-spacing="2" fill="#bc8cff">WRITE</text><g class="ar-b" data-tiphead="you + coding agent" data-tip="You steer; the agent writes and rebuilds."><rect x="40" y="127" width="240" height="112" rx="14" fill="#1a1a1a" stroke="#bc8cff" stroke-width="2"/><text x="58" y="163" class="t" font-size="18">you + coding agent</text><text x="58" y="189" class="d" font-size="14">brief, review, comment</text><text x="58" y="215" class="m" font-size="13"></text></g><g class="ar-b" data-tiphead="agent skills" data-tip="Instructions in .agents/skills/ that any coding agent can follow."><rect x="40" y="261" width="240" height="112" rx="14" fill="#1a1a1a" stroke="#bc8cff" stroke-width="2"/><text x="58" y="297" class="t" font-size="18">agent skills</text><text x="58" y="323" class="d" font-size="14">slide-deck, deck-feedback,</text><text x="58" y="349" class="m" font-size="13">address-feedback</text></g><line x1="286" y1="296" x2="310" y2="296" stroke="#666666" stroke-width="2.5" marker-end="url(#ar-a)"/><text x="320" y="30" font-size="14" font-weight="700" letter-spacing="2" fill="#3b82f6">SOURCE</text><g class="ar-b" data-tiphead="slides.tpl.qmd" data-tip="The deck source; build_deck.py generates slides.qmd from it."><rect x="320" y="60" width="240" height="112" rx="14" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/><text x="338" y="96" class="t" font-size="18">slides.tpl.qmd</text><text x="338" y="122" class="d" font-size="14">deck text + FIG tokens</text><text x="338" y="148" class="m" font-size="13">decks/&lt;category&gt;/&lt;deck&gt;/</text></g><g class="ar-b" data-tiphead="make_figures.py + data/" data-tip="Every figure is code; rerun after edits."><rect x="320" y="194" width="240" height="112" rx="14" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/><text x="338" y="230" class="t" font-size="18">make_figures.py + data/</text><text x="338" y="256" class="d" font-size="14">figures from data</text><text x="338" y="282" class="m" font-size="13">→ images/*.svg</text></g><g class="ar-b" data-tiphead="comments.json" data-tip="Written by the comment UI, read by the agent."><rect x="320" y="328" width="240" height="112" rx="14" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/><text x="338" y="364" class="t" font-size="18">comments.json</text><text x="338" y="390" class="d" font-size="14">open and resolved comments</text><text x="338" y="416" class="m" font-size="13">per deck, gitignored</text></g><line x1="566" y1="296" x2="590" y2="296" stroke="#666666" stroke-width="2.5" marker-end="url(#ar-a)"/><text x="600" y="30" font-size="14" font-weight="700" letter-spacing="2" fill="#3fb950">SERVE: 1 PROCESS</text><g class="ar-b" data-tiphead="deck server" data-tip="quarto/scripts/serve.py: serves every rendered deck and the index page, swaps re-rendered slides into open pages."><rect x="600" y="60" width="240" height="112" rx="14" fill="#1a1a1a" stroke="#3fb950" stroke-width="2"/><text x="618" y="96" class="t" font-size="18">deck server</text><text x="618" y="122" class="d" font-size="14">open this one: all decks</text><text x="618" y="148" class="m" font-size="13">:8093</text></g><g class="ar-b" data-tiphead="comments/exports" data-tip="Same process, second port: comments.json, edit-mode saves and live previews, HTML, PPTX and PDF downloads."><rect x="600" y="194" width="240" height="112" rx="14" fill="#1a1a1a" stroke="#3fb950" stroke-width="2"/><text x="618" y="230" class="t" font-size="18">comments/exports</text><text x="618" y="256" class="d" font-size="14">API: edit mode, downloads</text><text x="618" y="282" class="m" font-size="13">:8094</text></g><g class="ar-b" data-tiphead="quarto render" data-tip="The server's watcher runs quarto render on a deck whose sources changed, one deck at a time."><rect x="600" y="328" width="240" height="112" rx="14" fill="#1a1a1a" stroke="#3fb950" stroke-width="2"/><text x="618" y="364" class="t" font-size="18">quarto render</text><text x="618" y="390" class="d" font-size="14">re-renders a changed deck</text><text x="618" y="416" class="m" font-size="13">~2 s per deck</text></g><line x1="846" y1="296" x2="870" y2="296" stroke="#666666" stroke-width="2.5" marker-end="url(#ar-a)"/><text x="880" y="30" font-size="14" font-weight="700" letter-spacing="2" fill="#f0883e">PUBLISH</text><g class="ar-b" data-tiphead="exports/" data-tip="One file per deck and format."><rect x="880" y="127" width="240" height="112" rx="14" fill="#1a1a1a" stroke="#f0883e" stroke-width="2"/><text x="898" y="163" class="t" font-size="18">exports/</text><text x="898" y="189" class="d" font-size="14">PDF · PPTX · HTML</text><text x="898" y="215" class="m" font-size="13">scripts/export.sh</text></g><g class="ar-b" data-tiphead="GitHub Pages" data-tip="Built by .github/workflows/pages.yml with scripts/build_site.sh; read-only, no comments or edit mode."><rect x="880" y="261" width="240" height="112" rx="14" fill="#1a1a1a" stroke="#f0883e" stroke-width="2"/><text x="898" y="297" class="t" font-size="18">GitHub Pages</text><text x="898" y="323" class="d" font-size="14">every deck, downloads opt-in</text><text x="898" y="349" class="m" font-size="13">on push to main</text></g>
</svg>
