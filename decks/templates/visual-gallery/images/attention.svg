0.6"/><text x="107" y="516" text-anchor="middle" class="mu" font-size="13">0.03</text><rect class="at-b" x="189" y="375" width="44" height="120" rx="5" fill="#3fb950" opacity="1"/><text x="211" y="516" text-anchor="middle" class="mu" font-size="13">0.52</text><rect class="at-b" x="293" y="481" width="44" height="14" rx="5" fill="#3b82f6" opacity="0.6"/><text x="315" y="516" text-anchor="middle" class="mu" font-size="13">0.06</text><rect class="at-b" x="397" y="490" width="44" height="5" rx="5" fill="#3b82f6" opacity="0.6"/><text x="419" y="516" text-anchor="middle" class="mu" font-size="13">0.02</text><rect class="at-b" x="501" y="490" width="44" height="5" rx="5" fill="#3b82f6" opacity="0.6"/><text x="523" y="516" text-anchor="middle" class="mu" font-size="13">0.02</text><rect class="at-b" x="605" y="465" width="44" height="30" rx="5" fill="#3b82f6" opacity="0.6"/><text x="627" y="516" text-anchor="middle" class="mu" font-size="13">0.13</text><rect class="at-b" x="709" y="486" width="44" height="9" rx="5" fill="#3b82f6" opacity="0.6"/><text x="731" y="516" text-anchor="middle" class="mu" font-size="13">0.04</text><rect class="at-b" x="813" y="477" width="44" height="18" rx="5" fill="#3b82f6" opacity="0.6"/><text x="835" y="516" text-anchor="middle" class="mu" font-size="13">0.08</text><rect class="at-b" x="917" y="488" width="44" height="7" rx="5" fill="#3b82f6" opacity="0.6"/><text x="939" y="516" text-anchor="middle" class="mu" font-size="13">0.03</text><rect class="at-b" x="1021" y="479" width="44" height="16" rx="5" fill="#3b82f6" opacity="0.6"/><text x="1043" y="516" text-anchor="middle" class="mu" font-size="13">0.07</text><line x1="60" y1="495" x2="1088" y2="495" stroke="#2a2a2a"/><g class="at-o"><rect x="715" y="64" width="240" height="52" rx="12" fill="#13233f" stroke="#3fb950" stroke-width="2"/><text x="835" y="96" text-anchor="middle" fill="#93c5fd" font-size="17" font-weight="600">out(it) = Σ wᵢ · vᵢ  ≈ v(cat)</text></g><text class="at-cap1" x="60" y="30" fill="#f0f0f0" font-weight="700" font-size="17">1 · score each token: q(it) · kᵢ / √d</text><text class="at-cap2" x="420" y="30" fill="#f0f0f0" font-weight="700" font-size="17">2 · softmax turns scores into weights</text><text class="at-cap3" x="780" y="30" fill="#f0f0f0" font-weight="700" font-size="17">3 · output = weighted mix of values</text><text x="60" y="568" class="mu" font-size="13">Each word carries a query q, a key k and a value v: three learned projections of its embedding (d = their length).</text><text x="60" y="590" class="mu" font-size="13">vᵢ is word i’s value, so the output is mostly the value of “cat”. Self-attention (Vaswani et al., 2017); weights are illustrative.</text>
