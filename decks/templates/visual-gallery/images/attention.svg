<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" font-family="Inter, sans-serif">
<style>.t{fill:#f0f0f0;font-weight:700}.d{fill:#a0a0a0}.mu{fill:#666666}.m{font-family:'JetBrains Mono',monospace;fill:#93c5fd}.at-a{animation:at-a 10s infinite}.at-b{transform-box:fill-box;transform-origin:bottom;animation:at-b 10s cubic-bezier(.2,.8,.3,1) infinite}.at-o{animation:at-o 10s infinite}.at-q{animation:at-q 10s infinite}@keyframes at-q{0%,4%{stroke-opacity:0}8%,96%{stroke-opacity:1}100%{stroke-opacity:0}}@keyframes at-a{0%,10%{stroke-dashoffset:var(--len)}35%,96%{stroke-dashoffset:0}100%{stroke-dashoffset:var(--len)}}@keyframes at-b{0%,38%{transform:scaleY(0)}58%,96%{transform:none}100%{transform:scaleY(0)}}@keyframes at-o{0%,62%{opacity:0}72%,96%{opacity:1}100%{opacity:0}}.at-cap1{animation:at-c1 10s infinite}.at-cap2{animation:at-c2 10s infinite}.at-cap3{animation:at-c3 10s infinite}@keyframes at-c1{0%,36%{opacity:1}38%,100%{opacity:.25}}@keyframes at-c2{0%,37%{opacity:.25}39%,60%{opacity:1}62%,100%{opacity:.25}}@keyframes at-c3{0%,61%{opacity:.25}63%,100%{opacity:1}}</style>
