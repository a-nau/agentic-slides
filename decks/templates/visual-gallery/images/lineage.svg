<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" font-family="Inter, sans-serif">
<style>.t{fill:#f0f0f0;font-weight:700}.d{fill:#a0a0a0}.mu{fill:#666666}.m{font-family:'JetBrains Mono',monospace;fill:#93c5fd}.ln-c{cursor:help}.ln-c:hover rect.ln-b{stroke:#fff}</style>
<rect x="0" y="0" width="1160" height="600" fill="#111111"/><line x1="90" y1="118" x2="1070" y2="118" stroke="#2a2a2a" stroke-width="3"/><line x1="188" y1="112" x2="188" y2="124" stroke="#2a2a2a" stroke-width="2"/><text x="188" y="102" class="mu" font-size="13" text-anchor="middle">2012</text><line x1="286" y1="112" x2="286" y2="124" stroke="#2a2a2a" stroke-width="2"/><text x="286" y="102" class="mu" font-size="13" text-anchor="middle">2013</text><line x1="384" y1="112" x2="384" y2="124" stroke="#2a2a2a" stroke-width="2"/><text x="384" y="102" class="mu" font-size="13" text-anchor="middle">2014</text><line x1="482" y1="112" x2="482" y2="124" stroke="#2a2a2a" stroke-width="2"/><text x="482" y="102" class="mu" font-size="13" text-anchor="middle">2015</text><line x1="580" y1="112" x2="580" y2="124" stroke="#2a2a2a" stroke-width="2"/><text x="580" y="102" class="mu" font-size="13" text-anchor="middle">2016</text><line x1="678" y1="112" x2="678" y2="124" stroke="#2a2a2a" stroke-width="2"/><text x="678" y="102" class="mu" font-size="13" text-anchor="middle">2017</text><line x1="776" y1="112" x2="776" y2="124" stroke="#2a2a2a" stroke-width="2"/><text x="776" y="102" class="mu" font-size="13" text-anchor="middle">2018</text><line x1="874" y1="112" x2="874" y2="124" stroke="#2a2a2a" stroke-width="2"/><text x="874" y="102" class="mu" font-size="13" text-anchor="middle">2019</text><line x1="972" y1="112" x2="972" y2="124" stroke="#2a2a2a" stroke-width="2"/><text x="972" y="102" class="mu" font-size="13" text-anchor="middle">2020</text><path d="M188,118 V158 H164 V180" fill="none" stroke="#3b82f6" stroke-width="2"/><circle cx="188" cy="118" r="9" fill="#3b82f6"/><g class="ln-c" data-tiphead="AlexNet (NIPS 2012)" data-tip="Krizhevsky, Sutskever, Hinton. Deck: decks/paper-reviews/alexnet/"><rect class="ln-b" x="40" y="180" width="248" height="330" rx="14" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/><rect x="40" y="180" width="248" height="6" rx="3" fill="#3b82f6"/><text x="60" y="224" class="t" font-size="26">AlexNet</text><text x="60" y="250" class="d" font-size="14">NIPS 2012</text><text x="60" y="300" font-size="14.5" fill="#f0f0f0">Deep CNNs trained on GPUs</text><text x="60" y="322" font-size="14.5" fill="#f0f0f0">win ImageNet by a wide margin</text><text x="60" y="348" class="mu" font-size="13.5">replaced: hand-designed features</text><line x1="60" y1="366" x2="268" y2="366" stroke="#2a2a2a"/><text x="60" y="420" font-size="50" font-weight="800" fill="#3b82f6">15.3%</text><text x="60" y="448" class="d" font-size="14">top-5 error vs 26.2% runner-up</text><text x="60" y="480" class="m" font-size="12">decks/</text><text x="60" y="497" class="m" font-size="12">paper-reviews/alexnet/</text></g><path d="M482,118 V158 H428 V180" fill="none" stroke="#3fb950" stroke-width="2"/><circle cx="482" cy="118" r="9" fill="#3fb950"/><g class="ln-c" data-tiphead="ResNet (CVPR 2016)" data-tip="He, Zhang, Ren, Sun. Deck: decks/paper-reviews/resnet/"><rect class="ln-b" x="304" y="180" width="248" height="330" rx="14" fill="#1a1a1a" stroke="#3fb950" stroke-width="2"/><rect x="304" y="180" width="248" height="6" rx="3" fill="#3fb950"/><text x="324" y="224" class="t" font-size="26">ResNet</text><text x="324" y="250" class="d" font-size="14">CVPR 2016</text><text x="324" y="300" font-size="14.5" fill="#f0f0f0">Identity shortcuts let nets go</text><text x="324" y="322" font-size="14.5" fill="#f0f0f0">152 layers deep and still train</text><text x="324" y="348" class="mu" font-size="13.5">replaced: nets of about 20 layers</text><line x1="324" y1="366" x2="532" y2="366" stroke="#2a2a2a"/><text x="324" y="420" font-size="50" font-weight="800" fill="#3fb950">3.57%</text><text x="324" y="448" class="d" font-size="14">top-5 error, ImageNet test</text><text x="324" y="480" class="m" font-size="12">decks/</text><text x="324" y="497" class="m" font-size="12">paper-reviews/resnet/</text></g><path d="M678,118 V158 H692 V180" fill="none" stroke="#bc8cff" stroke-width="2"/><circle cx="678" cy="118" r="9" fill="#bc8cff"/><g class="ln-c" data-tiphead="Transformer (NIPS 2017)" data-tip="Vaswani et al.. Deck: decks/paper-reviews/attention/"><rect class="ln-b" x="568" y="180" width="248" height="330" rx="14" fill="#1a1a1a" stroke="#bc8cff" stroke-width="2"/><rect x="568" y="180" width="248" height="6" rx="3" fill="#bc8cff"/><text x="588" y="224" class="t" font-size="26">Transformer</text><text x="588" y="250" class="d" font-size="14">NIPS 2017</text><text x="588" y="300" font-size="14.5" fill="#f0f0f0">Attention alone, no recurrence:</text><text x="588" y="322" font-size="14.5" fill="#f0f0f0">every word reads every other</text><text x="588" y="348" class="mu" font-size="13.5">replaced: recurrent nets for text</text><line x1="588" y1="366" x2="796" y2="366" stroke="#2a2a2a"/><text x="588" y="420" font-size="50" font-weight="800" fill="#bc8cff">28.4</text><text x="588" y="448" class="d" font-size="14">BLEU, WMT 2014 EN-DE</text><text x="588" y="480" class="m" font-size="12">decks/</text><text x="588" y="497" class="m" font-size="12">paper-reviews/attention/</text></g><path d="M972,118 V158 H956 V180" fill="none" stroke="#f0883e" stroke-width="2"/><circle cx="972" cy="118" r="9" fill="#f0883e"/><g class="ln-c" data-tiphead="NeRF (ECCV 2020)" data-tip="Mildenhall, Srinivasan, Tancik et al.. Deck: decks/paper-reviews/nerf/"><rect class="ln-b" x="832" y="180" width="248" height="330" rx="14" fill="#1a1a1a" stroke="#f0883e" stroke-width="2"/><rect x="832" y="180" width="248" height="6" rx="3" fill="#f0883e"/><text x="852" y="224" class="t" font-size="26">NeRF</text><text x="852" y="250" class="d" font-size="14">ECCV 2020</text><text x="852" y="300" font-size="14.5" fill="#f0f0f0">One MLP stores one scene;</text><text x="852" y="322" font-size="14.5" fill="#f0f0f0">rendering it is differentiable</text><text x="852" y="348" class="mu" font-size="13.5">replaced: meshes and voxel grids</text><line x1="852" y1="366" x2="1060" y2="366" stroke="#2a2a2a"/><text x="852" y="420" font-size="50" font-weight="800" fill="#f0883e">31.01</text><text x="852" y="448" class="d" font-size="14">PSNR on synthetic scenes</text><text x="852" y="480" class="m" font-size="12">decks/</text><text x="852" y="497" class="m" font-size="12">paper-reviews/nerf/</text></g><text x="40" y="548" class="d" font-size="15">One card per paper-review deck in this repo, placed on the year it appeared.</text><text x="40" y="572" class="mu" font-size="13">Each headline number uses that paper’s own metric and benchmark; do not compare them across cards.</text>
</svg>
