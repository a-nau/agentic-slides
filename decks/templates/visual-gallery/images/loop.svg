<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" font-family="Inter, sans-serif">
<style>.t{fill:#f0f0f0;font-weight:700}.d{fill:#a0a0a0}.mu{fill:#666666}.m{font-family:'JetBrains Mono',monospace;fill:#93c5fd}.lp-o{transform-origin:580px 300px;animation:lp-o 10s linear infinite}@keyframes lp-o{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}.lp-s0{animation:lp-s0 10s infinite}@keyframes lp-s0{0%,20%{stroke:#3b82f6}24%,100%{stroke:#2a2a2a}}.lp-s1{animation:lp-s1 10s infinite}@keyframes lp-s1{0%,24%{stroke:#2a2a2a}27%,45%{stroke:#3b82f6}49%,100%{stroke:#2a2a2a}}.lp-s2{animation:lp-s2 10s infinite}@keyframes lp-s2{0%,49%{stroke:#2a2a2a}52%,70%{stroke:#3b82f6}74%,100%{stroke:#2a2a2a}}.lp-s3{animation:lp-s3 10s infinite}@keyframes lp-s3{0%,74%{stroke:#2a2a2a}77%,95%{stroke:#3b82f6}99%,100%{stroke:#2a2a2a}}</style>
<rect x="0" y="0" width="1160" height="600" fill="#111111"/><circle cx="580" cy="300" r="195" fill="none" stroke="#2a2a2a" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/><g class="lp-o"><circle cx="580" cy="105" r="9" fill="#3b82f6"/><circle cx="580" cy="105" r="17" fill="#3b82f6" opacity=".25"/></g><rect class="lp-s0" x="430" y="32" width="300" height="90" rx="14" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/><text x="450" y="64" class="t" font-size="20">build</text><text x="450" y="88" class="d" font-size="15">agent writes the deck</text><text x="450" y="110" class="m" font-size="13">slide-deck skill</text><rect class="lp-s1" x="800" y="255" width="300" height="90" rx="14" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/><text x="820" y="287" class="t" font-size="20">render</text><text x="820" y="311" class="d" font-size="15">live server reloads</text><text x="820" y="333" class="m" font-size="13">scripts/start.sh</text><rect class="lp-s2" x="430" y="478" width="300" height="90" rx="14" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/><text x="450" y="510" class="t" font-size="20">comment</text><text x="450" y="534" class="d" font-size="15">you select text → 💬</text><text x="450" y="556" class="m" font-size="13">comments.json</text><rect class="lp-s3" x="60" y="255" width="300" height="90" rx="14" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2"/><text x="80" y="287" class="t" font-size="20">address</text><text x="80" y="311" class="d" font-size="15">agent folds feedback in</text><text x="80" y="333" class="m" font-size="13">address-feedback skill</text><text x="580" y="296" text-anchor="middle" class="t" font-size="22">one deck, many rounds</text><text x="580" y="324" text-anchor="middle" class="d" font-size="15">build, look, comment, repeat</text>
</svg>
