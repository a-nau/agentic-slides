<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" font-family="Inter, sans-serif">
<style>.t{fill:#f0f0f0;font-weight:700}.d{fill:#a0a0a0}.mu{fill:#666666}.m{font-family:'JetBrains Mono',monospace;fill:#93c5fd}.sk-l{cursor:help}.sk-l:hover rect.sk-f{stroke:#fff}</style>
<rect x="0" y="0" width="1160" height="600" fill="#111111"/><text x="40" y="28" class="mu" font-size="13" letter-spacing="1.5">LAYERS</text><text x="880" y="28" class="mu" font-size="13" letter-spacing="1.5">TRACKED FILES</text><g class="sk-l" data-tiphead="decks" data-tip="Markdown source, generated figures and comments, one folder per deck."><rect class="sk-f" x="80" y="44" width="720" height="86" rx="12" fill="#1a1a1a" stroke="#3b82f6" stroke-width="2"/><rect x="80" y="44" width="10" height="86" rx="5" fill="#3b82f6"/><text x="110" y="78" class="t" font-size="20">decks</text><text x="110" y="106" class="d" font-size="15">5 decks in 2 categories: paper-reviews, templates</text><text x="780" y="78" text-anchor="end" class="m" font-size="13">decks/&lt;category&gt;/&lt;deck&gt;/</text></g><rect x="880" y="74" width="230" height="22" rx="4" fill="#3b82f6" opacity=".75"/><text x="1118" y="91" class="t" font-size="16">121</text><g class="sk-l" data-tiphead="agent skills" data-tip="Skills: address-feedback, deck-feedback, export-all-html, onboarding, slide-deck. Any coding agent can follow them."><rect class="sk-f" x="66" y="144" width="748" height="86" rx="12" fill="#1a1a1a" stroke="#bc8cff" stroke-width="2"/><rect x="66" y="144" width="10" height="86" rx="5" fill="#bc8cff"/><text x="96" y="178" class="t" font-size="20">agent skills</text><text x="96" y="206" class="d" font-size="15">5 skills that build, review and export decks</text><text x="794" y="178" text-anchor="end" class="m" font-size="13">.agents/skills/  ·  AGENTS.md</text></g><rect x="880" y="174" width="72" height="22" rx="4" fill="#bc8cff" opacity=".75"/><text x="960" y="191" class="t" font-size="16">38</text><g class="sk-l" data-tiphead="fact-checking" data-tip="Ingests review.json (the agent’s claim-by-claim check of a paper deck) and shows each claim next to the page it came from."><rect class="sk-f" x="52" y="244" width="776" height="86" rx="12" fill="#1a1a1a" stroke="#e3b341" stroke-width="2"/><rect x="52" y="244" width="10" height="86" rx="5" fill="#e3b341"/><text x="82" y="278" class="t" font-size="20">fact-checking</text><text x="82" y="306" class="d" font-size="15">checks a paper deck's claims against the source PDF</text><text x="808" y="278" text-anchor="end" class="m" font-size="13">source-review/  ·  scripts/review.sh</text></g><rect x="880" y="274" width="25" height="22" rx="4" fill="#e3b341" opacity=".75"/><text x="913" y="291" class="t" font-size="16">13</text><g class="sk-l" data-tiphead="scripts" data-tip="start.sh runs the live server; export.sh and pptx_export/ write the exports."><rect class="sk-f" x="38" y="344" width="804" height="86" rx="12" fill="#1a1a1a" stroke="#3fb950" stroke-width="2"/><rect x="38" y="344" width="10" height="86" rx="5" fill="#3fb950"/><text x="68" y="378" class="t" font-size="20">scripts</text><text x="68" y="406" class="d" font-size="15">serve, comment, export to PDF, PPTX and HTML, publish</text><text x="822" y="378" text-anchor="end" class="m" font-size="13">scripts/  ·  scripts/pptx_export/</text></g><rect x="880" y="374" width="93" height="22" rx="4" fill="#3fb950" opacity=".75"/><text x="981" y="391" class="t" font-size="16">49</text><g class="sk-l" data-tiphead="theme" data-tip="Every deck loads quarto/themes/agentic.css (ported from themes/agentic.css) through its front-matter css: list."><rect class="sk-f" x="24" y="444" width="832" height="86" rx="12" fill="#1a1a1a" stroke="#f0883e" stroke-width="2"/><rect x="24" y="444" width="10" height="86" rx="5" fill="#f0883e"/><text x="54" y="478" class="t" font-size="20">theme</text><text x="54" y="506" class="d" font-size="15">the agentic look: dark, blue accent, logo, fonts</text><text x="836" y="478" text-anchor="end" class="m" font-size="13">themes/agentic.css  ·  assets/</text></g><rect x="880" y="474" width="29" height="22" rx="4" fill="#f0883e" opacity=".75"/><text x="917" y="491" class="t" font-size="16">15</text><text x="40" y="550" class="mu" font-size="13">FOUNDATION</text><text x="880" y="550" class="mu" font-size="13">git ls-files, at build time</text>
